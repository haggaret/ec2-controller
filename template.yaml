AWSTemplateFormatVersion: '2010-09-09'
Transform: 'AWS::Serverless-2016-10-31'
Description: Lambda function to sync source google calendar(s) to destination calendar

Parameters:
  LambdaName:
    Type: String
    Default: 'ec2-controller'
    Description: Name for the lambda function
  InstanceIds:
    Type: String
    Default: ''
    Description: Comma separated list of Instance IDs to control (optional)

Conditions:
  InstanceIdsPresent: !Not [ !Equals [ !Ref InstanceIds, '' ] ]

Resources:
  Ec2Controller:
    Type: 'AWS::Serverless::Function'
    Properties:
      FunctionName: !Ref LambdaName
      CodeUri: src/
      Handler: ec2-controller.lambda_handler
      Runtime: python3.13
      Description: Lambda function to control a given EC2 instance
      MemorySize: 256
      Timeout: 300
      Environment:
        Variables:
          INSTANCEIDS: !If [InstanceIdsPresent, !Ref InstanceIds, !Ref 'AWS::NoValue']
      FunctionUrlConfig:
        AuthType: NONE
      Policies:
        - Version: "2012-10-17"
          Statement:
            # EC2
            -
              Effect: "Allow"
              Action:
                - "ec2:StartInstances"
                - "ec2:DescribeInstances"
                - "ec2:StopInstances"
              Resource: !If
                - InstanceIdsPresent
                - !Split
                  - ","
                  - !Sub
                    - "arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:instance/${JoinedIds}"
                    - JoinedIds: !Join
                        - !Sub ",arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:instance/"
                        - !Split [",", !Ref InstanceIds]
                - '*'

Outputs:
  SamEndpointUrl:
    Description: "Lambda URL"
    Value: !GetAtt Ec2ControllerUrl.FunctionUrl
