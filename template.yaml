AWSTemplateFormatVersion: '2010-09-09'
Transform: 'AWS::Serverless-2016-10-31'
Description: Lambda function to sync source google calendar(s) to destination calendar

Parameters:
  LambdaName:
    Type: String
    Default: 'ec2-controller'
    Description: Name for the lambda function
  InstanceIds:
    Type: CommaDelimitedList
    Description: Comma separated list of Instance IDs to control (optional)
    Default: ""

Conditions:
# Join the list into a single string first to check if it is empty
  InstanceIdsPresent: !Not [!Equals [!Join ["", !Ref InstanceIds], ""]]

Resources:
  Ec2Controller:
    Type: 'AWS::Serverless::Function'
    Properties:
      FunctionName: !Ref LambdaName
      CodeUri: src/
      Handler: ec2-controller.lambda_handler
      Runtime: python3.13
      Description: Lambda function to control a given EC2 instance
      MemorySize: 256
      Timeout: 300
      Environment:
        Variables:
          # Convert the list back into a comma-separated string for Python
          INSTANCEIDS: !If
            - InstanceIdsPresent
            - !Join [",", !Ref InstanceIds]
            - !Ref "AWS::NoValue"
      FunctionUrlConfig:
        AuthType: NONE
      Policies:
        - Version: "2012-10-17"
          Statement:
            # DescribeInstances can't be restricted to a single EC2 ARN
            - Effect: Allow
              Action:
                - "ec2:DescribeInstances"
              Resource: "*"
            - Effect: Allow
              Action:
                - "ec2:StartInstances"
                - "ec2:StopInstances"
              Resource: !If
                - InstanceIdsPresent
                - !Split
                  - ","
                  - !Sub
                    - "arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:instance/${JoinedIds}"
                    - JoinedIds: !Join
                        - ",arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:instance/"
                        - !Ref InstanceIds
                - "*"

Outputs:
  SamEndpointUrl:
    Description: "Lambda URL"
    Value: !GetAtt Ec2ControllerUrl.FunctionUrl
